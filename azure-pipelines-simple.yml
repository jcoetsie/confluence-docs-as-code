# Azure DevOps Pipeline for publishing MkDocs site to Confluence (Simplified Version)
# This pipeline uses variable groups for better secret management

trigger:
  branches:
    include:
    - main
    - master

pr:
  branches:
    include:
    - main
    - master

pool:
  vmImage: 'ubuntu-latest'

# Use variable groups to manage secrets and configuration
# Create a variable group named 'confluence-config' in Azure DevOps with your configuration
variables:
- group: confluence-config

jobs:
- job: BuildAndTest
  displayName: 'Build and Test'
  strategy:
    matrix:
      Node16:
        node_version: '16.x'
      Node18:
        node_version: '18.x'
    maxParallel: 2

  steps:
  - task: NodeTool@0
    displayName: 'Use Node.js $(node_version)'
    inputs:
      versionSpec: '$(node_version)'

  - task: Cache@2
    displayName: 'Cache npm dependencies'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
        npm
      path: '~/.npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run build
    displayName: 'Build project'
    condition: succeeded()

  - script: npm test
    displayName: 'Run tests'

- job: PublishToConfluence
  displayName: 'Publish to Confluence'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  
  steps:
  - task: NodeTool@0
    displayName: 'Use Node.js 18.x'
    inputs:
      versionSpec: '18.x'

  - task: Cache@2
    displayName: 'Cache npm dependencies'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
        npm
      path: '~/.npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run build
    displayName: 'Build project'

  - script: |
      echo "Publishing documentation to Confluence..."
      node dist/index.js
    displayName: 'Publish to Confluence'
    env:
      INPUT_CONFLUENCE_TENANT: $(CONFLUENCE_TENANT)
      INPUT_CONFLUENCE_SPACE: $(CONFLUENCE_SPACE)
      INPUT_CONFLUENCE_USER: $(CONFLUENCE_USER)
      INPUT_CONFLUENCE_TOKEN: $(CONFLUENCE_TOKEN)
      INPUT_CONFLUENCE_PARENT_PAGE: $(CONFLUENCE_PARENT_PAGE)
      INPUT_CONFLUENCE_TITLE_PREFIX: $(CONFLUENCE_TITLE_PREFIX)
      INPUT_CONFLUENCE_FORCE_UPDATE: $(CONFLUENCE_FORCE_UPDATE)
      INPUT_CONFLUENCE_CLEANUP: $(CONFLUENCE_CLEANUP)
      INPUT_KROKI_ENABLED: $(KROKI_ENABLED)
      INPUT_KROKI_HOST: $(KROKI_HOST)
      INPUT_MERMAID_RENDERER: $(MERMAID_RENDERER)
      INPUT_PLANTUML_RENDERER: $(PLANTUML_RENDERER)
