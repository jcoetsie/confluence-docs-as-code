# Step Template for Publishing to Confluence (Resource-based)
# This template uses Azure DevOps resources to reference the action repository

parameters:
- name: confluence_tenant
  type: string
  displayName: 'Confluence Tenant'
  
- name: confluence_space
  type: string
  displayName: 'Confluence Space Key'
  
- name: confluence_user
  type: string
  displayName: 'Confluence User'
  
- name: confluence_token
  type: string
  displayName: 'Confluence Token'
  
- name: confluence_parent_page
  type: string
  displayName: 'Confluence Parent Page'
  default: ''
  
- name: confluence_title_prefix
  type: string
  displayName: 'Confluence Title Prefix'
  default: ''
  
- name: confluence_force_update
  type: string
  displayName: 'Force Update All Pages'
  default: 'no'
  
- name: confluence_cleanup
  type: string
  displayName: 'Cleanup Pages'
  default: 'no'
  
- name: kroki_enabled
  type: string
  displayName: 'Enable Kroki'
  default: 'yes'
  
- name: kroki_host
  type: string
  displayName: 'Kroki Host'
  default: 'https://kroki.io'
  
- name: mermaid_renderer
  type: string
  displayName: 'Mermaid Renderer'
  default: 'kroki'
  
- name: plantuml_renderer
  type: string
  displayName: 'PlantUML Renderer'
  default: 'kroki'
  
- name: docs_path
  type: string
  displayName: 'Path to documentation (relative to repo root)'
  default: '.'

- name: node_version
  type: string
  displayName: 'Node.js Version'
  default: '18.x'

steps:
- task: NodeTool@0
  displayName: 'Use Node.js ${{ parameters.node_version }}'
  inputs:
    versionSpec: '${{ parameters.node_version }}'

- script: |
    echo "Publishing documentation to Confluence..."
    echo "Docs path: ${{ parameters.docs_path }}"
    echo "Tenant: ${{ parameters.confluence_tenant }}"
    echo "Space: ${{ parameters.confluence_space }}"
    
    # Change to the action directory (checked out as a resource)
    cd $(Agent.BuildDirectory)/confluence-action
    
    # Ensure dependencies are installed
    npm ci
    
    # Build if needed
    if [ ! -f "dist/index.js" ]; then
      npm run build
    fi
    
    # Set the working directory to the docs path
    export GITHUB_WORKSPACE="$(Build.SourcesDirectory)/${{ parameters.docs_path }}"
    
    # Run the action
    node dist/index.js
  displayName: 'Publish to Confluence'
  env:
    INPUT_CONFLUENCE_TENANT: ${{ parameters.confluence_tenant }}
    INPUT_CONFLUENCE_SPACE: ${{ parameters.confluence_space }}
    INPUT_CONFLUENCE_USER: ${{ parameters.confluence_user }}
    INPUT_CONFLUENCE_TOKEN: ${{ parameters.confluence_token }}
    INPUT_CONFLUENCE_PARENT_PAGE: ${{ parameters.confluence_parent_page }}
    INPUT_CONFLUENCE_TITLE_PREFIX: ${{ parameters.confluence_title_prefix }}
    INPUT_CONFLUENCE_FORCE_UPDATE: ${{ parameters.confluence_force_update }}
    INPUT_CONFLUENCE_CLEANUP: ${{ parameters.confluence_cleanup }}
    INPUT_KROKI_ENABLED: ${{ parameters.kroki_enabled }}
    INPUT_KROKI_HOST: ${{ parameters.kroki_host }}
    INPUT_MERMAID_RENDERER: ${{ parameters.mermaid_renderer }}
    INPUT_PLANTUML_RENDERER: ${{ parameters.plantuml_renderer }}
