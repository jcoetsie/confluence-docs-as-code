# Step Template for Publishing to Confluence (Simplified)
# This template downloads the pre-built action and runs it against your documentation

parameters:
- name: confluence_tenant
  type: string
  displayName: 'Confluence Tenant'
  
- name: confluence_space
  type: string
  displayName: 'Confluence Space Key'
  
- name: confluence_user
  type: string
  displayName: 'Confluence User'
  
- name: confluence_token
  type: string
  displayName: 'Confluence Token'
  
- name: confluence_parent_page
  type: string
  displayName: 'Confluence Parent Page'
  default: ''
  
- name: confluence_title_prefix
  type: string
  displayName: 'Confluence Title Prefix'
  default: ''
  
- name: confluence_force_update
  type: string
  displayName: 'Force Update All Pages'
  default: 'no'
  
- name: confluence_cleanup
  type: string
  displayName: 'Cleanup Pages'
  default: 'no'
  
- name: kroki_enabled
  type: string
  displayName: 'Enable Kroki'
  default: 'yes'
  
- name: kroki_host
  type: string
  displayName: 'Kroki Host'
  default: 'https://kroki.io'
  
- name: mermaid_renderer
  type: string
  displayName: 'Mermaid Renderer'
  default: 'kroki'
  
- name: plantuml_renderer
  type: string
  displayName: 'PlantUML Renderer'
  default: 'kroki'
  
- name: working_directory
  type: string
  displayName: 'Working Directory (where your mkdocs.yml or docs are located)'
  default: '.'

- name: node_version
  type: string
  displayName: 'Node.js Version'
  default: '18.x'

steps:
- task: NodeTool@0
  displayName: 'Use Node.js ${{ parameters.node_version }}'
  inputs:
    versionSpec: '${{ parameters.node_version }}'

- checkout: none
  displayName: 'Skip default checkout (we only need our working directory)'

- checkout: self
  displayName: 'Checkout documentation source'
  path: 'docs-source'

# Alternative approach: Use the action as a resource
- script: |
    echo "Setting up confluence publisher..."
    
    # Install the confluence publisher globally or use npx
    npm install -g md-to-confluence-action@latest || {
      echo "Package not available, using direct approach..."
      
      # Create working directory
      mkdir -p $(Agent.TempDirectory)/confluence-publisher
      cd $(Agent.TempDirectory)/confluence-publisher
      
      # Download the latest release or specific version
      curl -L https://github.com/YourOrg/confluence-docs-as-code/archive/refs/heads/main.zip -o action.zip
      unzip action.zip
      cd confluence-docs-as-code-main
      
      # Install and build
      npm ci
      npm run build
      
      # Make it available globally
      export CONFLUENCE_ACTION_PATH="$(pwd)"
      echo "##vso[task.setvariable variable=CONFLUENCE_ACTION_PATH]$(pwd)"
    }
  displayName: 'Setup Confluence Publisher'

- script: |
    echo "Publishing documentation to Confluence..."
    echo "Tenant: ${{ parameters.confluence_tenant }}"
    echo "Space: ${{ parameters.confluence_space }}"
    echo "Working Directory: $(Build.SourcesDirectory)/docs-source/${{ parameters.working_directory }}"
    
    # Change to the documentation directory
    cd "$(Build.SourcesDirectory)/docs-source/${{ parameters.working_directory }}"
    
    # Run the confluence publisher
    if command -v md-to-confluence-action >/dev/null 2>&1; then
      md-to-confluence-action
    else
      # Use the downloaded version
      cd "$CONFLUENCE_ACTION_PATH"
      node dist/index.js
    fi
  displayName: 'Publish to Confluence'
  env:
    INPUT_CONFLUENCE_TENANT: ${{ parameters.confluence_tenant }}
    INPUT_CONFLUENCE_SPACE: ${{ parameters.confluence_space }}
    INPUT_CONFLUENCE_USER: ${{ parameters.confluence_user }}
    INPUT_CONFLUENCE_TOKEN: ${{ parameters.confluence_token }}
    INPUT_CONFLUENCE_PARENT_PAGE: ${{ parameters.confluence_parent_page }}
    INPUT_CONFLUENCE_TITLE_PREFIX: ${{ parameters.confluence_title_prefix }}
    INPUT_CONFLUENCE_FORCE_UPDATE: ${{ parameters.confluence_force_update }}
    INPUT_CONFLUENCE_CLEANUP: ${{ parameters.confluence_cleanup }}
    INPUT_KROKI_ENABLED: ${{ parameters.kroki_enabled }}
    INPUT_KROKI_HOST: ${{ parameters.kroki_host }}
    INPUT_MERMAID_RENDERER: ${{ parameters.mermaid_renderer }}
    INPUT_PLANTUML_RENDERER: ${{ parameters.plantuml_renderer }}
    GITHUB_WORKSPACE: $(Build.SourcesDirectory)/docs-source/${{ parameters.working_directory }}
